name: TranscriptionStudio
options:
  bundleIdPrefix: com.fcttechnologies
  createIntermediateGroups: true

# Simulator builds are arm64-only: the x86_64 sim slice can't resolve cross-import overlays
# (`_CoreSpotlight_FoundationModels` in TranscriptLibraryAssistant), which breaks Release
# builds (Debug hides it via ONLY_ACTIVE_ARCH=YES). No Intel-Mac simulator is in use anywhere.
settings:
  base:
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

# Suppress Xcode's "Update to recommended settings" nag durably (it fires when these are below
# the current Xcode version, and the .xcodeproj is regenerated every build so a manual "Perform
# Changes" click would never stick).
attributes:
  LastUpgradeCheck: "9999"
  LastSwiftUpdateCheck: "9999"

# All code lives in the app target under Sources/App, organised by concern (the app-build
# standard's Phase 1 shape — there is no per-app package). Extension targets and the headless
# CLI share app-target source files by target membership: the paths listed below. FCTFoundation
# is the sibling checkout consumed as a local package; granular products only.
packages:
  FCTFoundation:
    path: ../FCTFoundation
  # On-device speech vendors: WhisperKit (ASR) + SpeakerKit (diarizer cross-check) + TTSKit
  # (synthesis) from the argmax monorepo, and FluidAudio (CoreML LuxTTS voice cloning), pinned
  # to the revision the cloning bench fixture-verified — move that pin only with a re-listen.
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.0.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: 5390df9752c8fc583596018360c5fd70d6fa6c75

settingGroups:
  fct:
    DEVELOPMENT_TEAM: X26SC78YDG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # Makes swiftc emit the per-source-file .stringsdata the gate's localization drift check reads.
    # A SwiftPM target with a defaultLocalization sets this itself; an app target does not, and
    # without it the check has nothing to compare the catalog against and says so rather than
    # passing.
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # ONE app target for every destination Transcription Studio ships to. The platform split lives in
  # build settings and `#if os(...)`, never in a second target: the AppShortcutsProvider has to
  # compile into the app target, and with two targets that requirement is met once and missed once.
  #
  # Isolation: NO default-actor-isolation setting here, deliberately. The target mixes UI with
  # engine/compute code (WhisperKit/Sortformer pipelines run off main), so a blanket MainActor
  # default would silently flip engine code onto the main actor; the isolation boundary is carried
  # by explicit marks instead (`@MainActor` on UI-facing types, plain `actor` on engines).
  TranscriptionStudio:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources/App
        excludes:
          # The CLI's two files carry the serve/one-shot command surface; TranscribeCLI.swift
          # also carries the executable's @main. Never compile them into the app target.
          - "**/CLI/**"
    dependencies:
      - package: FCTFoundation
        product: FCTMetrics
      # Granular FCTFoundation products only — every one is imported by some file in the target;
      # a dependency of a dependency is not importable.
      - package: FCTFoundation
        product: FCTEntities
      - package: FCTFoundation
        product: FCTComponentsUI
      - package: FCTFoundation
        product: FCTIntelligence
      - package: FCTFoundation
        product: FCTContacts
      # Speak → clean text: the record → transcribe → clean → copy → hand-off sequence behind
      # DictateIntent and the Control Center tile.
      - package: FCTFoundation
        product: FCTDictation
      - package: FCTFoundation
        product: FCTSync
      - package: FCTFoundation
        product: FCTServerSync
      - package: FCTFoundation
        product: FCTBlobSync
      - package: FCTFoundation
        product: FCTAccount
      # The shared FCT account as a product: the schema fragment in this app's store and wire, the
      # onboarding gate behind the front door, and the profile section in Settings.
      - package: FCTFoundation
        product: FCTAccountProfile
      - package: FCTFoundation
        product: FCTSupport
      # The front door: the intro carousel and the required sign-in that ends it. The app supplies
      # its pages and nothing else — no pager, no dots, no sign-in surface of its own.
      - package: FCTFoundation
        product: FCTOnboarding
      - package: FCTFoundation
        product: FCTGlanceables
      # The detached debug store: every `#if DEBUG` seed and reset acts on a second, local-only
      # store file, so nothing under DEBUG can push to the account. Compiles to nothing in Release.
      - package: FCTFoundation
        product: FCTScreenshotStudio
      # The Share extension ships on both platforms and is itself multiplatform — no filter.
      - target: ShareExtension
      - package: argmax-oss-swift
        product: WhisperKit
      - package: argmax-oss-swift
        product: SpeakerKit
      - package: argmax-oss-swift
        product: TTSKit
      - package: FluidAudio
        product: FluidAudio
      # These two ship on iOS only. Without the filter the macOS product embeds an iOS-only appex
      # and Xcode hard-fails on the mismatched platform content — `platform: iOS` on the extension
      # target itself is necessary and not sufficient, because the dependency edge is what embeds.
      - target: BackgroundAssetsExtension
        destinationFilters: [iOS]
      - target: WidgetExtensioniOS
        destinationFilters: [iOS]
    # Entitlements are NOT declared here. xcodegen's `entitlements:` key generates exactly one file
    # per target, which cannot express the iOS set alongside the macOS one, so both files are
    # hand-owned in Sources/App and selected by CODE_SIGN_ENTITLEMENTS below.
    info:
      path: Sources/App/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        # The standard exemption: Transcription Studio uses only HTTPS and the platform's own
        # crypto (the one CryptoKit call is a SHA-256 model-artifact check, which is a hash and
        # not encryption), so no non-exempt encryption ships. Declared here so no upload stops
        # to ask.
        ITSAppUsesNonExemptEncryption: false
        # The ten languages this app ships. Declared HERE, in the Info.plist proper: the
        # `INFOPLIST_KEY_CFBundleLocalizations` build-setting variant is silently ignored, and
        # without the real key every bundle in the process — the app's catalogs and every
        # FCTFoundation module's — resolves English whatever it has been translated into.
        CFBundleLocalizations:
          - en
          - es
          - zh-Hans
          - fr
          - de
          - pt-BR
          - ja
          - ko
          - it
          - ru
        # Every string below states WHERE the work happens and WHERE the result is kept, as two
        # separate facts. Collapsing them into "nothing leaves your device" is the one thing these
        # must never say: the recordings, the transcripts, a tagged place and a bound speaker's
        # name are all stored in the user's FCT account (TranscriptionSync + TranscriptionSyncSchema).
        NSMicrophoneUsageDescription: >-
          Transcription Studio records from your microphone. Speech recognition and
          speaker identification run entirely on this device; the recording and its
          transcript are stored in your private FCT account so they reach your other devices.
        # macOS only (ScreenCaptureKit meeting capture); inert in the iOS build.
        NSAudioCaptureUsageDescription: >-
          Transcription Studio captures system audio to transcribe meetings and calls.
          Transcription runs entirely on this Mac; the recording and its transcript are
          stored in your private FCT account so they reach your other devices.
        # Ecosystem actions (Phase 3). Calendar is write-only — the app only ever *adds* an
        # event you review and confirm; it never reads your calendar. Reminders has no write-only
        # scope, so it requests the minimal available (full). Contacts is read-only, used to match
        # a mentioned name to a saved contact for speaker mapping and Siri name resolution.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Transcription Studio adds meetings you review from a transcript to your
          calendar. It only ever adds — it never reads your existing calendar.
        NSRemindersFullAccessUsageDescription: >-
          Transcription Studio adds action items you review from a transcript to
          your reminders.
        NSContactsUsageDescription: >-
          Transcription Studio matches names in your transcripts to your contacts so
          speakers and mentions show real names. It only reads your contacts; the name
          you bind to a speaker is saved with that transcript in your FCT account.
        # Per-session privacy lock: Face ID / Touch ID (passcode fallback) gates opening a
        # session you've marked private.
        NSFaceIDUsageDescription: >-
          Transcription Studio uses Face ID to unlock sessions you've marked private, so
          only you can open them.
        # Opt-in recording-location tag (off by default). Captured once at recording start and
        # reverse-geocoded to a coarse place name stored with the session — which then travels
        # with that session to the account (`location_name`/`latitude`/`longitude` are columns on
        # the transcript_session wire).
        NSLocationWhenInUseUsageDescription: >-
          Transcription Studio can tag a recording with the place you made it, so you can find it
          by location later. It's captured only while recording, and the tag is saved with that
          session in your private FCT account so it reaches your other devices.
        # iOS-only keys below; each is inert in the macOS build.
        UIBackgroundModes:
          - audio
        # Live Activities (recording + playback), rendered by WidgetExtensioniOS. Frequent
        # updates cover the recording activity's ~1/s waveform refresh — and the
        # BGContinuedProcessingTask's system Live Activity, which mirrors a file/link job's
        # stage + progress ~1/s while it runs in the background.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Background transcription (BGContinuedProcessingTask, iOS 26+): a file/link job keeps
        # running with GPU/ANE cover when the app is backgrounded mid-run. The wildcard suffix is
        # a per-job UUID; the concrete id is registered + submitted at runtime
        # (ContinuedTranscriptionTask). Must stay in sync with `identifierPrefix` there, which is
        # built from the bundle id at runtime — so this wildcard's parent tracks it.
        BGTaskSchedulerPermittedIdentifiers:
          - com.fcttechnologies.TranscriptionStudio.transcription.*
        # --- Background Assets (self-hosted, unmanaged) -------------------------------------
        # The system reads these before first launch: it downloads the manifest at BAManifestURL,
        # then wakes BackgroundAssetsExtension to schedule the WhisperKit model files it lists.
        # BAManifestURL must resolve, at ship time, to the committed manifest
        # (Sources/App/BackgroundAssets/whisperkit-model-manifest.json). See
        # Documentation/BACKGROUND-ASSETS.md.
        BAManifestURL: https://assets.fct-technologies.com/transcriptionstudio/whisperkit-model-manifest.json
        BAAppGroupID: group.com.fcttechnologies.TranscriptionStudio
        # Uncompressed on-disk size of all assets (bytes) — shown on the App Store. Matches the
        # manifest total; regenerate both with scripts/gen-ba-manifest.sh if the model changes.
        BAMaxInstallSize: 1638464446
        # App-review-enforced ceilings on the initial (post-install) download. All our downloads
        # are non-essential, so the essential allowance is 0 and the non-essential allowance
        # covers the model total plus a small margin. Domains the extension may fetch from —
        # HuggingFace resolves large files via a redirect to its LFS CDN, so those hosts are
        # allow-listed too (verify the exact CDN host at ship time; see the docs).
        BAInitialDownloadRestrictions:
          BADownloadAllowance: 1700000000
          BAEssentialDownloadAllowance: 0
          BADownloadDomainAllowList:
            - huggingface.co
            - "*.huggingface.co"
            - "*.hf.co"
            - "*.cloudfront.net"
        # The app's one custom URL scheme, serving two hosts. `//ingest` is the Share
        # extension's ping to hand a staged item over; `//dictation?id=` is FCTDictation's
        # hand-off, opening the app onto a finished dictation the App Group container holds —
        # only the id crosses, never the words. Registering a scheme registers it for every host,
        # so one entry covers both; the name is a label nothing resolves against, and deriving it
        # from the bundle id keeps it per-platform through the one shared entry.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).urls
            CFBundleURLSchemes:
              - transcriptionstudio
    settings:
      groups: [fct]
      base:
        # One bundle id across every destination: Universal Purchase requires it, so an iPhone
        # subscriber is entitled on the Mac from the same store record. The surviving id is the
        # one the Mac slice already carried, whose App ID holds a working app-group association.
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio
        # One target, one product name — so one Swift module name, and one mangled App Shortcuts
        # provider string on both platforms. The displayed name was already identical on both.
        PRODUCT_NAME: TranscriptionStudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Transcription Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad must support all orientations (or declare full-screen) or Xcode warns; iPhone keeps
        # the standard three (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_DEBUG_DYLIB: YES
        # The Mac slice is deliberately NOT sandboxed: it runs Hardened Runtime (Release only —
        # see the configs block below) plus the hardened-process entitlements, because URL ingest
        # shells out to yt-dlp/ffmpeg and the app reads the user's own Application Support tree.
        # Sign in with Apple + the shared keychain access group are declared via the entitlements
        # files below — the same keychain group on both platforms, so one session serves both. The
        # keychain group needs no portal registration (unlike an App Group): it is an entitlement
        # string plus a regenerated profile, and every app carrying it must be signed by the same
        # team. Sign in with Apple DOES need each bundle id registered for it.
        CODE_SIGN_ENTITLEMENTS: Sources/App/TranscriptionStudio.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/App/TranscriptionStudio-macOS.entitlements
      configs:
        # The unit suite is app-hosted against this app as its test host. Under Hardened Runtime,
        # library validation admits only same-Team-ID code, and the test bundle's frameworks are
        # ad-hoc signed — so hardening stays scoped to Release, where the archive actually runs.
        # The hardened-process entitlement KEYS live here too (not in the .entitlements files):
        # with those keys in the file, automatic signing embeds a provisioning profile whose
        # portal-minted entitlements harden even the Debug test host — dyld then kills it loading
        # the ad-hoc-signed package frameworks (reads exactly like a broken rpath).
        Release:
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
          ENABLE_ENHANCED_SECURITY: YES
          "ENABLE_POINTER_AUTHENTICATION[sdk=macosx*]": NO
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/App/TranscriptionStudio-macOS-release.entitlements
        Debug:
          "EMBED_PROVISIONING_PROFILE[sdk=macosx*]": NO

  # The headless transcription CLI (macOS): URL or file → transcript on stdout, plus the 24/7
  # `--serve` HTTP service behind the Jarvis transcribe tool and /speak voice API. It shares the
  # app's engine sources by target membership — same files, no module boundary. Everything except
  # the CLI entry point compiles into both targets; the app's @main shell is excluded here for the
  # same reason the CLI's @main is excluded there (one @main per executable).
  transcribe-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "TranscriptionStudioApp.swift"
          - "TranscriptionShortcuts.swift"
          - "Info.plist"
          - "*.entitlements"
          # A privacy manifest is a bundle resource. This target is a Mach-O tool with no bundle,
          # so sweeping it in would only add a copy-file step producing nothing.
          - "PrivacyInfo.xcprivacy"
          - "Assets.xcassets/**"
          - "MacShell/MacRootView.swift"   # SwiftUI Mac window shell — app-only
          # The front door (account gate, intro carousel, restore stage). App-only, and the one
          # place FCTOnboarding is imported — a headless tool has no front door to open.
          - "Views/Root/**"
    dependencies:
      - package: FCTFoundation
        product: FCTEntities
      - package: FCTFoundation
        product: FCTIntelligence
      - package: FCTFoundation
        product: FCTContacts
      # Compiled by membership from Sources/App/Dictation — a target that compiles a file must
      # link what that file imports, even though a headless tool has no dictation surface.
      - package: FCTFoundation
        product: FCTDictation
      - package: FCTFoundation
        product: FCTSync
      - package: FCTFoundation
        product: FCTServerSync
      - package: FCTFoundation
        product: FCTBlobSync
      - package: FCTFoundation
        product: FCTAccount
      # This target compiles the app's schema and Settings sources by membership, and both import
      # it — a target that compiles a file must link what that file imports.
      - package: FCTFoundation
        product: FCTAccountProfile
      - package: FCTFoundation
        product: FCTSupport
      - package: FCTFoundation
        product: FCTGlanceables
      # This target compiles the app's Settings sources by membership, and the debug tools there
      # import it — a target that compiles a file must link what that file imports. Release-empty.
      - package: FCTFoundation
        product: FCTScreenshotStudio
      - package: argmax-oss-swift
        product: WhisperKit
      - package: argmax-oss-swift
        product: SpeakerKit
      - package: argmax-oss-swift
        product: TTSKit
      - package: FluidAudio
        product: FluidAudio
    settings:
      groups: [fct]
      base:
        PRODUCT_NAME: transcribe-cli
        # Emits the executable's code as a sibling .debug.dylib in Debug, which is what lets
        # TranscribeCLITests link `@testable import transcribe_cli` symbols (a plain Mach-O
        # tool exports nothing test bundles can load against).
        ENABLE_DEBUG_DYLIB: YES
        # The CLI links CoreAI directly (macOS 27 system framework, Sortformer diarizer).
        OTHER_LDFLAGS: "-framework CoreAI"

  # The Share extension — one multiplatform target building the same platform-conditional
  # ShareViewController over the shared-item sources (AppGroup, the drop-box, the classifier),
  # compiled in by membership. Everything that genuinely differs is selected by SDK: the
  # Info.plist (macOS takes the dictionary activation form; iOS has no audio-with-max-count key at
  # all, so its activation must be a predicate string), and the entitlements (a macOS app
  # extension must be sandboxed even though its host is not). It stages the shared item into the
  # App Group drop-box and never transcribes — extensions are memory-capped and WhisperKit would
  # blow the budget.
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      # Only the shared Swift source compiles; the iOS/ + macOS/ subfolders hold Info.plists +
      # entitlements referenced via build settings, not bundled resources. The SharedItems files
      # ride in by membership — Foundation-only, extension-safe forever.
      - path: Sources/ShareExtension
        excludes:
          - "macOS/**"
          - "iOS/**"
      - path: Sources/App/SharedItems
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ShareExtension/iOS/Info.plist
        "INFOPLIST_FILE[sdk=macosx*]": Sources/ShareExtension/macOS/Info.plist
        # No App Intents in this target — skip metadata extraction (silences the processor's
        # "no AppIntents.framework dependency" build notice at its cause).
        LM_SKIP_METADATA_EXTRACTION: YES
        CODE_SIGN_ENTITLEMENTS: Sources/ShareExtension/iOS/ShareExtensioniOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/ShareExtension/macOS/ShareExtensionMac.entitlements

  # The widget extension (iOS only) — hosts the recording + playback Live Activities (Dynamic
  # Island + Lock Screen) and the Dictate control. Compiles only the lean glance sources (attributes + button intents +
  # pure clock/level math) by membership; the heavy engine code never enters the extension's
  # memory sandbox. Every intent it carries performs in the app's process — the activity buttons
  # by `LiveActivityIntent`, the dictation control by `.foreground` — so the extension renders and
  # hands off, and never opens a microphone or a model. It keeps metadata extraction, because a
  # control's action is an App Intent the HOSTING extension has to carry. One SDK, one
  # Info.plist — so it keeps `platform:`, and the app filters its edge.
  WidgetExtensioniOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      # Only the Swift sources compile; iOS/ holds the Info.plist referenced via build settings.
      - path: Sources/WidgetExtension
        excludes:
          - "iOS/**"
      - path: Sources/App/Glance
      # The dictation control's intent, and nothing else from that folder: a control performs its
      # action through an intent the hosting extension carries, and this one is a foreground
      # trampoline with no dependencies — the app's own dictation sources stay out.
      - path: Sources/App/Dictation/OpenDictationIntent.swift
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.WidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/WidgetExtension/iOS/Info.plist

  # The Background Assets downloader extension (iOS only). An ExtensionKit extension — no
  # NSExtension dict; the extension point is declared via EXAppExtensionAttributes in its
  # Info.plist and the entry point via @main. The system launches it before the app's first
  # launch to pre-download the WhisperKit model. Compiles only the lean model-layout/manifest
  # sources by membership (no WhisperKit), fitting the extension's tight memory sandbox.
  BackgroundAssetsExtension:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/BackgroundAssetsExtension
        excludes:
          - "Info.plist"
          - "BackgroundAssetsExtension.entitlements"
      - path: Sources/App/BackgroundAssets/WhisperKitModelLayout.swift
      - path: Sources/App/BackgroundAssets/WhisperKitModelManifest.swift
      - path: Sources/App/SharedItems/AppGroup.swift
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.BackgroundAssetsExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/BackgroundAssetsExtension/Info.plist
        # No App Intents in this target — skip metadata extraction (see ShareExtension).
        LM_SKIP_METADATA_EXTRACTION: YES
        CODE_SIGN_ENTITLEMENTS: Sources/BackgroundAssetsExtension/BackgroundAssetsExtension.entitlements

  # The unit suite is app-hosted (`@testable import TranscriptionStudio`) and runs on every
  # destination the app supports. On the macOS destination it runs natively on the Mac with no
  # simulator — that is what keeps the everyday loop at host speed. The former swift-test suites
  # (library, Mac-shell, CLI) all merged into this one bundle: one process, one host.
  TranscriptionStudioTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Tests/TranscriptionStudioTests
    dependencies:
      - target: TranscriptionStudio
      # Only the adopter-contract harnesses are declared here. The other FCTFoundation/vendored
      # modules the test files import resolve through the APP's own link — declaring them here
      # too would statically link them twice (app + xctest), and duplicate ObjC classes across
      # the two images misbehave at runtime (a second BlobStore class identity breaks the very
      # gates under test).
      - package: FCTFoundation
        product: FCTServerSyncTesting
      - package: FCTFoundation
        product: FCTBlobSyncTesting
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.Tests
        GENERATE_INFOPLIST_FILE: YES
        # `$(BUNDLE_EXECUTABLE_FOLDER_PATH)` resolves per destination (the executable sits at the
        # bundle root on iOS and under Contents/MacOS on macOS), so one setting hosts both.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TranscriptionStudio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TranscriptionStudio"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # The headless CLI's own unit suite: a plain logic bundle on macOS (no app host — the CLI is
  # not an app), testing the serve HTTP surface, the warm engines and the speak routes through
  # `@testable import transcribe_cli`.
  TranscribeCLITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TranscribeCLITests
    dependencies:
      - target: transcribe-cli
      # Declared for MODULE RESOLUTION only: this logic bundle has no app host, so the
      # vendored C-wrapper modules don't resolve through the target edge alone. Linking is
      # against the CLI's own .debug.dylib (OTHER_LDFLAGS below), not these products.
      - package: FluidAudio
        product: FluidAudio
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.CLITests
        GENERATE_INFOPLIST_FILE: YES
        # Link the CLI's Debug dylib directly: this is a logic bundle (no app host), so the
        # TEST_HOST machinery that wires an app's .debug.dylib into its tests doesn't apply.
        OTHER_LDFLAGS: "$(OTHER_LDFLAGS) -dylib_path $(BUILT_PRODUCTS_DIR)/transcribe-cli.debug.dylib"

# One scheme now serves both platforms — pick the destination from the menu.
schemes:
  TranscriptionStudio:
    build:
      targets:
        TranscriptionStudio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TranscriptionStudioTests
  # The headless CLI's own scheme (release builds + install-serve.sh) plus its unit suite.
  transcribe-cli:
    build:
      targets:
        transcribe-cli: all
    test:
      config: Debug
      targets:
        - TranscribeCLITests
