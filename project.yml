name: TranscriptionStudio
options:
  bundleIdPrefix: com.fcttechnologies
  createIntermediateGroups: true

# Simulator builds are arm64-only: the x86_64 sim slice can't resolve cross-import overlays
# (`_CoreSpotlight_FoundationModels` in TranscriptLibraryAssistant), which breaks Release
# builds (Debug hides it via ONLY_ACTIVE_ARCH=YES). No Intel-Mac simulator is in use anywhere.
settings:
  base:
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

# Suppress Xcode's "Update to recommended settings" nag durably (it fires when these are below
# the current Xcode version, and the .xcodeproj is regenerated every build so a manual "Perform
# Changes" click would never stick).
attributes:
  LastUpgradeCheck: "9999"
  LastSwiftUpdateCheck: "9999"

# All real code lives in the local Swift package (Package.swift in this directory);
# the app and extension targets are thin shells. Regenerate the project with `xcodegen generate`
# after an edit here. The .xcodeproj is tracked — commit the regenerated result
# alongside this file.
packages:
  TranscriptionStudioPackage:
    path: .

settingGroups:
  fct:
    DEVELOPMENT_TEAM: X26SC78YDG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # Hardening (xcode-security-audit): Enhanced Security v2. Pointer authentication (arm64e) is
    # OFF: WhisperKit/SpeakerKit ship via the external argmax-oss-swift package; keep it off until
    # that dep is verified arm64e-universal — a non-arm64e binary package crashes under pointer
    # authentication.
    ENABLE_ENHANCED_SECURITY: YES
    ENABLE_POINTER_AUTHENTICATION: NO

targets:
  # ONE app target for every destination Transcription Studio ships to. The platform split lives in
  # build settings and `#if os(...)`, never in a second target: the AppShortcutsProvider has to
  # compile into the app target, and with two targets that requirement is met once and missed once.
  TranscriptionStudio:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources/App
    dependencies:
      - package: TranscriptionStudioPackage
        product: TranscriptionKit
      # The Mac-only feature kit: yt-dlp/ffmpeg URL ingest (Process, which iOS has no API for),
      # ScreenCaptureKit meeting capture (SCShareableContent / SCDisplay / SCContentFilter are
      # API_UNAVAILABLE(ios) even though the framework itself gained an iOS 27 slice), and the Mac
      # window shell. The filter is what keeps the module from being built for the iOS destination
      # at all; without it the iOS build compiles it and fails. It stays a package target rather
      # than folding into Sources/App because `transcribe-cli` depends on it too.
      - package: TranscriptionStudioPackage
        product: TranscriptionMacKit
        destinationFilters: [macOS]
      # The Share extension ships on both platforms and is itself multiplatform — no filter.
      - target: ShareExtension
      # These two ship on iOS only. Without the filter the macOS product embeds an iOS-only appex
      # and Xcode hard-fails on the mismatched platform content — `platform: iOS` on the extension
      # target itself is necessary and not sufficient, because the dependency edge is what embeds.
      - target: BackgroundAssetsExtension
        destinationFilters: [iOS]
      - target: WidgetExtensioniOS
        destinationFilters: [iOS]
    # Entitlements are NOT declared here. xcodegen's `entitlements:` key generates exactly one file
    # per target, which cannot express the iOS set alongside the macOS one, so both files are
    # hand-owned in Sources/App and selected by CODE_SIGN_ENTITLEMENTS below.
    info:
      path: Sources/App/Info.plist
      properties:
        NSMicrophoneUsageDescription: >-
          Transcription Studio records from your microphone to transcribe and
          identify speakers — entirely on this device. Nothing leaves your device.
        # macOS only (ScreenCaptureKit meeting capture); inert in the iOS build.
        NSAudioCaptureUsageDescription: >-
          Transcription Studio captures system audio to transcribe meetings and
          calls — entirely on this device. Nothing leaves your Mac.
        # Ecosystem actions (Phase 3). Calendar is write-only — the app only ever *adds* an
        # event you review and confirm; it never reads your calendar. Reminders has no write-only
        # scope, so it requests the minimal available (full). Contacts is read-only, used to match
        # a mentioned name to a saved contact for speaker mapping and Siri name resolution.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Transcription Studio adds meetings you review from a transcript to your
          calendar. It only ever adds — it never reads your existing calendar.
        NSRemindersFullAccessUsageDescription: >-
          Transcription Studio adds action items you review from a transcript to
          your reminders.
        NSContactsUsageDescription: >-
          Transcription Studio matches names in your transcripts to your contacts so
          speakers and mentions show real names — read only, entirely on this device.
        # Per-session privacy lock: Face ID / Touch ID (passcode fallback) gates opening a
        # session you've marked private.
        NSFaceIDUsageDescription: >-
          Transcription Studio uses Face ID to unlock sessions you've marked private, so
          only you can open them.
        # Opt-in recording-location tag (off by default). Captured once at recording start and
        # reverse-geocoded to a coarse place name stored with the session — entirely on this
        # device; the location is never uploaded.
        NSLocationWhenInUseUsageDescription: >-
          Transcription Studio can tag a recording with the place you made it, so you can find
          it by location later — captured only while recording and kept entirely on this device.
        # iOS-only keys below; each is inert in the macOS build.
        UIBackgroundModes:
          - audio
        # Live Activities (recording + playback), rendered by WidgetExtensioniOS. Frequent
        # updates cover the recording activity's ~1/s waveform refresh — and the
        # BGContinuedProcessingTask's system Live Activity, which mirrors a file/link job's
        # stage + progress ~1/s while it runs in the background.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Background transcription (BGContinuedProcessingTask, iOS 26+): a file/link job keeps
        # running with GPU/ANE cover when the app is backgrounded mid-run. The wildcard suffix is
        # a per-job UUID; the concrete id is registered + submitted at runtime
        # (ContinuedTranscriptionTask). Must stay in sync with `identifierPrefix` there, which is
        # built from the bundle id at runtime — so this wildcard's parent tracks it.
        BGTaskSchedulerPermittedIdentifiers:
          - com.fcttechnologies.TranscriptionStudio.transcription.*
        # --- Background Assets (self-hosted, unmanaged) -------------------------------------
        # The system reads these before first launch: it downloads the manifest at BAManifestURL,
        # then wakes BackgroundAssetsExtension to schedule the WhisperKit model files it lists.
        # BAManifestURL must resolve, at ship time, to the committed manifest
        # (Sources/BackgroundAssetsKit/Resources/whisperkit-model-manifest.json). See
        # Documentation/BACKGROUND-ASSETS.md.
        BAManifestURL: https://assets.fct-technologies.com/transcriptionstudio/whisperkit-model-manifest.json
        BAAppGroupID: group.com.fcttechnologies.TranscriptionStudio
        # Uncompressed on-disk size of all assets (bytes) — shown on the App Store. Matches the
        # manifest total; regenerate both with scripts/gen-ba-manifest.sh if the model changes.
        BAMaxInstallSize: 1638464446
        # App-review-enforced ceilings on the initial (post-install) download. All our downloads
        # are non-essential, so the essential allowance is 0 and the non-essential allowance
        # covers the model total plus a small margin. Domains the extension may fetch from —
        # HuggingFace resolves large files via a redirect to its LFS CDN, so those hosts are
        # allow-listed too (verify the exact CDN host at ship time; see the docs).
        BAInitialDownloadRestrictions:
          BADownloadAllowance: 1700000000
          BAEssentialDownloadAllowance: 0
          BADownloadDomainAllowList:
            - huggingface.co
            - "*.huggingface.co"
            - "*.hf.co"
            - "*.cloudfront.net"
        # Custom URL scheme the Share extension opens to hand a staged item to this app. The name
        # is a label nothing resolves against; deriving it from the bundle id keeps it
        # per-platform through the one shared entry.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).ingest
            CFBundleURLSchemes:
              - transcriptionstudio
    settings:
      groups: [fct]
      base:
        # One bundle id across every destination: Universal Purchase requires it, so an iPhone
        # subscriber is entitled on the Mac from the same store record. The surviving id is the
        # one the Mac slice already carried, whose App ID holds a working app-group association.
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio
        # One target, one product name — so one Swift module name, and one mangled App Shortcuts
        # provider string on both platforms. The displayed name was already identical on both.
        PRODUCT_NAME: TranscriptionStudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Transcription Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad must support all orientations (or declare full-screen) or Xcode warns; iPhone keeps
        # the standard three (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor   # thin @main shell; the mixed TranscriptionKit package stays nonisolated-by-default
        ENABLE_DEBUG_DYLIB: YES
        # The Mac slice is deliberately NOT sandboxed: it runs Hardened Runtime plus the
        # hardened-process entitlements instead, because URL ingest shells out to yt-dlp/ffmpeg
        # and the app reads the user's own Application Support tree.
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # Sign in with Apple + the shared keychain access group are declared via the entitlements
        # files below — the same keychain group on both platforms, so one session serves both. The
        # keychain group needs no portal registration (unlike an App Group): it is an entitlement
        # string plus a regenerated profile, and every app carrying it must be signed by the same
        # team. Sign in with Apple DOES need each bundle id registered for it.
        CODE_SIGN_ENTITLEMENTS: Sources/App/TranscriptionStudio.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/App/TranscriptionStudio-macOS.entitlements

  # The Share extension — one multiplatform target building the same platform-conditional
  # ShareViewController over the lean ShareKit. Everything that genuinely differs is selected by
  # SDK: the Info.plist
  # (macOS takes the dictionary activation form; iOS has no audio-with-max-count key at all, so its
  # activation must be a predicate string), and the entitlements (a macOS app extension must be
  # sandboxed even though its host is not). It stages the shared item into the App Group drop-box
  # and never transcribes — extensions are memory-capped and WhisperKit would blow the budget.
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      # Only the shared Swift source compiles; the iOS/ + macOS/ subfolders hold Info.plists +
      # entitlements referenced via build settings, not bundled resources.
      - path: Sources/ShareExtension
        excludes:
          - "macOS/**"
          - "iOS/**"
    dependencies:
      - package: TranscriptionStudioPackage
        product: ShareKit
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ShareExtension/iOS/Info.plist
        "INFOPLIST_FILE[sdk=macosx*]": Sources/ShareExtension/macOS/Info.plist
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # No App Intents in this target — skip metadata extraction (silences the processor's
        # "no AppIntents.framework dependency" build notice at its cause).
        LM_SKIP_METADATA_EXTRACTION: YES
        CODE_SIGN_ENTITLEMENTS: Sources/ShareExtension/iOS/ShareExtensioniOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/ShareExtension/macOS/ShareExtensionMac.entitlements

  # The widget extension (iOS only) — hosts the recording + playback Live Activities (Dynamic
  # Island + Lock Screen). Links only the lean GlanceKit (attributes + button intents + pure
  # clock/level math); the heavy TranscriptionKit never enters the extension's memory sandbox.
  # The intents perform in the app's process (LiveActivityIntent), so the extension stays a
  # renderer. One SDK, one Info.plist — so it keeps `platform:`, and the app filters its edge.
  WidgetExtensioniOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      # Only the Swift sources compile; iOS/ holds the Info.plist referenced via build settings.
      - path: Sources/WidgetExtension
        excludes:
          - "iOS/**"
    dependencies:
      - package: TranscriptionStudioPackage
        product: GlanceKit
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.WidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/WidgetExtension/iOS/Info.plist
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # The Background Assets downloader extension (iOS only). An ExtensionKit extension — no
  # NSExtension dict; the extension point is declared via EXAppExtensionAttributes in its
  # Info.plist and the entry point via @main. The system launches it before the app's first
  # launch to pre-download the WhisperKit model. Stays lean (BackgroundAssetsKit + Foundation,
  # no WhisperKit) to fit the extension's tight memory sandbox. Default (nonisolated) actor
  # isolation — the BADownloaderExtension callbacks are nonisolated, unlike the MainActor shells.
  BackgroundAssetsExtension:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/BackgroundAssetsExtension
        excludes:
          - "Info.plist"
          - "BackgroundAssetsExtension.entitlements"
    dependencies:
      - package: TranscriptionStudioPackage
        product: BackgroundAssetsKit
    settings:
      groups: [fct]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio.BackgroundAssetsExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/BackgroundAssetsExtension/Info.plist
        # No App Intents in this target — skip metadata extraction (see ShareExtension).
        LM_SKIP_METADATA_EXTRACTION: YES
        CODE_SIGN_ENTITLEMENTS: Sources/BackgroundAssetsExtension/BackgroundAssetsExtension.entitlements

# One scheme now serves both platforms — pick the destination from the menu.
schemes:
  TranscriptionStudio:
    build:
      targets:
        TranscriptionStudio: all
    run:
      config: Debug
    test:
      config: Debug
