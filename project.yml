name: TranscriptionStudio
options:
  bundleIdPrefix: com.fcttechnologies
  createIntermediateGroups: true

# Suppress Xcode's "Update to recommended settings" nag durably (it fires when these are below
# the current Xcode version, and the .xcodeproj is regenerated every build so a manual "Perform
# Changes" click would never stick).
attributes:
  LastUpgradeCheck: "9999"
  LastSwiftUpdateCheck: "9999"

# All real code lives in the local Swift package (Package.swift in this directory);
# the app targets are thin shells. Regenerate the project with `xcodegen generate`
# (the .xcodeproj is gitignored so worktree builds never conflict on pbxproj).
packages:
  TranscriptionStudioPackage:
    path: .

targets:
  TranscriptionStudio:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/MacApp
    dependencies:
      - package: TranscriptionStudioPackage
        product: TranscriptionKit
      - package: TranscriptionStudioPackage
        product: TranscriptionMacKit
    info:
      path: Sources/MacApp/Info.plist
      properties:
        NSMicrophoneUsageDescription: >-
          Transcription Studio records from your microphone to transcribe and
          identify speakers — entirely on this device. Nothing leaves your Mac.
        NSAudioCaptureUsageDescription: >-
          Transcription Studio captures system audio to transcribe meetings and
          calls — entirely on this device. Nothing leaves your Mac.
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Transcription Studio
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor   # thin @main shell; the mixed TranscriptionKit package stays nonisolated-by-default
        ENABLE_DEBUG_DYLIB: YES
        # Hardening (xcode-security-audit): Hardened Runtime + Enhanced Security v2.
        # Pointer authentication (arm64e) is OFF: WhisperKit/SpeakerKit ship via the external
        # argmax-oss-swift package; keep it off until that dep is verified arm64e-universal.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_ENHANCED_SECURITY: YES
        ENABLE_POINTER_AUTHENTICATION: NO
        # iCloud/CloudKit capability is declared via the entitlements file below (shared
        # container iCloud.com.fcttechnologies.TranscriptionStudio for both targets → Mac↔iOS
        # sync). The CloudKit container itself is provisioned in Xcode — selecting the team on
        # this target auto-creates it. Code + entitlements are all that's in scope here.
        CODE_SIGN_ENTITLEMENTS: Sources/MacApp/TranscriptionStudio.entitlements

  TranscriptionStudioiOS:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/iOSApp
    dependencies:
      - package: TranscriptionStudioPackage
        product: TranscriptionKit
    info:
      path: Sources/iOSApp/Info.plist
      properties:
        NSMicrophoneUsageDescription: >-
          Transcription Studio records from your microphone to transcribe and
          identify speakers — entirely on this device. Nothing leaves your phone.
        UIBackgroundModes:
          - audio
          - remote-notification   # CloudKit push-triggered SwiftData sync
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.fcttechnologies.TranscriptionStudioiOS
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Transcription Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # iPad must support all orientations (or declare full-screen) or Xcode warns; iPhone keeps
        # the standard three (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor   # thin @main shell; the mixed TranscriptionKit package stays nonisolated-by-default
        ENABLE_DEBUG_DYLIB: YES
        # Hardening (xcode-security-audit): Enhanced Security v2. Pointer authentication OFF —
        # WhisperKit/SpeakerKit ship via the external argmax-oss-swift package (see Mac target note).
        ENABLE_ENHANCED_SECURITY: YES
        ENABLE_POINTER_AUTHENTICATION: NO
        # iCloud/CloudKit capability is declared via the entitlements file below (same shared
        # container as the Mac target). The CloudKit container is provisioned in Xcode — team
        # selection auto-creates it. Code + entitlements are all that's in scope here.
        CODE_SIGN_ENTITLEMENTS: Sources/iOSApp/TranscriptionStudioiOS.entitlements

schemes:
  TranscriptionStudio:
    build:
      targets:
        TranscriptionStudio: all
    run:
      config: Debug
    test:
      config: Debug
  TranscriptionStudioiOS:
    build:
      targets:
        TranscriptionStudioiOS: all
    run:
      config: Debug
